[routing]
default = "ollama"

[routing.rules]
# Route by task intent — override per-deployment as needed
simple_text  = { provider = "supergrok", model = "grok-4.6" }
image_input  = { provider = "gemini", model = "gemini-2.5-flash" }
long_context = { provider = "gemini",    model = "gemini-2.5-pro" }
complex      = { provider = "supergrok", model = "grok-4.6" }

# Local / privacy-sensitive tasks — route to Ollama
local        = { provider = "ollama",    model = "llama3.1" }

[routing.fallback]
chain      = ["supergrok", "ollama", "gemini", "openrouter"]
retry_on   = ["rate_limit", "server_error", "timeout"]
max_retries = 3

[agent]
name = "HairyClaw"
data_dir = "./data"
# Single source of truth: PRIMARY_MAX_ITERATIONS in packages/core/src/iteration-limits.ts
max_iterations_per_run = 35
max_context_tokens = 100000
# Agent mode: "unified" (single model, all tools) or "orchestrator" (brain/hands split)
mode = "unified"

# Orchestrator (brain_hands) mode settings (only used when mode = "orchestrator")
# The orchestrator (brain) reasons, plans, and delegates.
# The executor (hands) runs tools with focused instructions.
# These `model` values only seed the durable, independently-switchable
# brain/hands primary the first time this deployment runs in orchestrator
# mode — see docs/model-roles.md for runtime selection, independent
# fallbacks, /model brain|hands commands, migration, and rollback.
[orchestrator]
# provider/model for the brain — fast conversational controller/planner.
# Recommended sanitized routing: non-reasoning Grok 4.20 primary, with
# non-Anthropic Ollama fallbacks. Only takes effect when [agent].mode =
# "orchestrator" — these are seed values for the durable brain selection
# (see docs/model-roles.md).
model = "supergrok/grok-4.20-0309-non-reasoning"
fallback_models = ["ollama/glm-5.2:cloud", "ollama/minimax-m3:cloud"]
# Tools the orchestrator gets (delegate + memory by default)
tools = ["delegate", "memory_recall", "memory_ingest"]
temperature = 0.7
max_tokens = 4096
# Explicit non-thinking brain: fast conversational controller, delegates
# deep technical reasoning to hands rather than "thinking" itself. Sent to
# Ollama fallbacks as think=false (never omitted — Ollama enables thinking
# by default for supported models).
thinking_level = "off"

[executor]
# provider/model for the hands — technical executor (coding, system design,
# debugging). Recommended sanitized routing: Grok 4.6 primary, with
# non-Anthropic Ollama fallbacks (a coding-oriented cloud model, then a
# local model as last resort).
model = "supergrok/grok-4.6"
fallback_models = ["ollama/glm-5.2:cloud", "ollama/deepseek-v4-flash:cloud", "ollama/qwen3.8:27b"]
# Tools the executor gets (system tools by default)
tools = ["bash", "read", "write", "edit", "web-search", "web-fetch"]
temperature = 0.1
max_tokens = 4096
# Single source of truth: CHILD_MAX_ITERATIONS in packages/core/src/iteration-limits.ts
max_iterations = 15
# Optional: override the executor system prompt entirely (leave empty for default)
system_prompt = ""
# Deliberately left unset: hands keeps its careful, deliberate default
# thinking behavior — this feature does not change executor policy.
# thinking_level = "off"

[health]
port = 9090

[channels.telegram]
enabled = false
mode = "bot"
# session_file used only in mtproto mode
session_file = "./data/telegram/session.txt"

[channels.whatsapp]
enabled = false

[channels.webhook]
enabled = false
port = 8080
secret = ""

[channels.cli]
enabled = true

[providers.supergrok]
enabled = false
base_url = "https://api.x.ai/v1"
auth_file = "./data/providers/supergrok-auth.json"
default_model = "grok-4.6"

[providers.openrouter]
enabled = false
default_model = "openai/gpt-oss-120b"

[providers.gemini]
enabled = false
default_model = "gemini-2.5-flash"

[providers.ollama]
enabled = false
base_url = "http://localhost:11434"
default_model = "llama3.2"
# Per-model fallback chain (tried in order, cross-provider).
# Format: "provider/model"
model_fallback_chain = []

[routing]
default_provider = "ollama"
fallback_chain = ["ollama", "supergrok", "gemini", "openrouter"]

[routing.cost]
track = true
daily_budget_usd = 10.0
alert_threshold_pct = 80

[growth]
reflection_enabled = true
initiative_enabled = false
skill_auto_promote = false

[resilience]
# Auth profile cooldown settings
cooldown_base_ms = 15000
cooldown_max_ms = 300000
cooldown_threshold = 1
# Per-request LLM timeout
request_timeout_ms = 120000

[delivery]
# Outbound message retry
max_attempts = 5
base_retry_ms = 5000
max_retry_ms = 300000

[memory]
# Auto-preload relevant memories into system prompt
auto_preload = true
preload_top_k = 3
preload_min_score = 0.3
preload_max_chars = 2000

[memory.structured]
enabled = true
file_path = "./data/memory/structured.json"
max_facts = 100
confidence_threshold = 0.7
max_injection_chars = 2000

[plugins.summarization]
enabled = true
trigger_tokens = 80000
keep_messages = 20
max_tool_result_chars = 500

[plugins.loop_detection]
enabled = true
warn_threshold = 3
hard_limit = 5
window_size = 20

[mcp]
enabled = false

# Example MCP server configurations (uncomment to use):
# [[mcp.servers]]
# name = "filesystem"
# enabled = true
# transport = "stdio"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]
# description = "Filesystem access via MCP"

[subagent]
max_concurrent = 3
default_timeout_ms = 120000
max_iterations = 10

[uploads]
enabled = true
base_dir = "./data/uploads"
max_file_size_mb = 50
max_files_per_thread = 20
convert_documents = true

[sandbox]
enabled = false
provider = "local"  # "local" | "docker"
base_dir = "./data/threads"

[tools.bash]
timeout_ms = 30000
max_output_bytes = 1048576

[tools.sidecar]
auto_build = true
health_check_interval_ms = 30000
